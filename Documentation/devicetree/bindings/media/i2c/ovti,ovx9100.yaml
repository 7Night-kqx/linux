%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/ovti,ovx9100.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OmniVision OVX9100 camera sensor

maintainers:
  - 7Night-kqx <7Night-kqx@users.noreply.github.com>

description: |
  OVX9100 is the Xiaomi dada main camera sensor. The current experimental
  implementation probes the sensor and contains a fixed RAW10 mode. C-PHY
  characterization, module identification, autofocus and OIS are separate
  bring-up requirements. Sensor nodes must remain disabled until these
  requirements are established for the phone under test.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: ovti,ovx9100

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: xclk

  clock-frequency:
    const: 19200000

  power-domains:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  bob-supply:
    description: Upstream BOB2 supply requested at 3.296 V during operation.

  vaf-supply:
    description: Lens supply requested at 3.304 V during operation.

  avdd-supply:
    description: Analogue sensor supply requested at 2.9 V.

  dovdd-supply:
    description: Sensor I/O supply requested at 1.8 V.

  dvdd-supply:
    description: Sensor digital supply requested at 1.2 V.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    unevaluatedProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          bus-type:
            const: 1

          data-lanes:
            items:
              - const: 0
              - const: 1
              - const: 2

          line-orders:
            items:
              - const: 0
              - const: 0
              - const: 0

        required:
          - bus-type
          - data-lanes

required:
  - compatible
  - reg
  - clocks
  - reset-gpios
  - bob-supply
  - vaf-supply
  - avdd-supply
  - dovdd-supply
  - dvdd-supply
  - port

unevaluatedProperties: false
